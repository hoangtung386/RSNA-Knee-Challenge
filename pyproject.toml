[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knee-mri"
version = "0.1.0"
description = "RSNA Knee MRI multi-label abnormality detection via text-guided knowledge distillation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "pydicom>=2.4",
    "Pillow>=10.0",
    "transformers>=4.44",
    "tokenizers",
    "accelerate",
    "safetensors",
    "huggingface_hub",
    "timm",
    "einops",
    "tqdm",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
eval = ["scikit-learn>=1.3"]
medio = ["SimpleITK", "nibabel"]
dev = ["pytest>=7.4", "pytest-cov", "ruff>=0.5", "mypy>=1.11", "pre-commit", "nbstripout"]

[project.scripts]
knee-masks = "knee_mri.cli:prepare_masks"
knee-weak-labels = "knee_mri.cli:precompute_weak_labels"
knee-teacher-feats = "knee_mri.cli:precompute_teacher_feats"
knee-guidance = "knee_mri.cli:precompute_guidance"
knee-train = "knee_mri.cli:train"
knee-evaluate = "knee_mri.cli:evaluate"
knee-predict = "knee_mri.cli:predict"
knee-explain = "knee_mri.cli:explain"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knee_mri = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ARG", "C4", "RET", "PTH"]
ignore = [
    "B008",    # function call in default argument - không áp dụng cho style ở đây
    "PTH123",  # open() vs Path.open() - open() vẫn hợp lệ và rõ ràng
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["knee_mri"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = ["src/knee_mri"]
# Không ghim python_version: stub của numpy dùng cú pháp 3.12, nên ép mypy giả
# định phiên bản cũ hơn khi đọc chúng sẽ sinh lỗi giả. Tính tương thích với
# Python 3.10 do ruff kiểm qua target-version trong [tool.ruff].
# Thư viện bên thứ ba (torch, transformers, pydicom, dinov2) không có stub đầy đủ.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "torch: test cần PyTorch (skip nếu chưa cài)",
    "slow: test chậm, cần dataset thật",
]
